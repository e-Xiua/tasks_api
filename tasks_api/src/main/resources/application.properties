spring.application.name=tasks_api


#RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=user

server.port=8091

# Logging minimal
logging.level.org.springframework.web=INFO

# ===============================
# = CONFIGURACIÓN DE BASE DE DATOS (H2 en memoria)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# Let Hibernate select the dialect automatically (H2Dialect explicit setting is unnecessary)
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Open Session In View to avoid accidental lazy-loading during view rendering
spring.jpa.open-in-view=false

# ===============================
# = CONFIGURACIÓN ADICIONAL
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Use legacy Ant path matcher so view-controller patterns that include
# Ant-style wildcards (e.g. /**/{spring:[^.]+}) are accepted. This makes
# it possible to forward non-API routes to index.html for SPA routing.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Disable Spring Cloud compatibility verifier
spring.cloud.compatibility-verifier.enabled=false

# Disable automatic static resource handling here because frontend is maintained in a separate repo
spring.web.resources.add-mappings=false
