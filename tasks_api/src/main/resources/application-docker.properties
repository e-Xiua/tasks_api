spring.application.name=tasks_api

# Server Configuration
server.port=${SERVER_PORT:8091}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:user}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.eXiua.tasksi=DEBUG

# ===============================
# = DATABASE CONFIGURATION (H2)
# ===============================
spring.datasource.url=jdbc:h2:file:/app/data/tasksdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 Console (deshabilitada en producción por seguridad)
spring.h2.console.enabled=false

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Path Matching Strategy
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Static Resources
spring.web.resources.add-mappings=false

# Disable Spring Cloud compatibility verifier
spring.cloud.compatibility-verifier.enabled=false

# CORS Configuration (será manejado por el API Gateway)
# Si se accede directamente, descomentar:
# spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*
# spring.web.cors.allow-credentials=true
